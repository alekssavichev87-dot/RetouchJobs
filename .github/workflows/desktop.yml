name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Portable app (RetouchJobs.exe)
        run: gradle createDistributable --no-daemon

      - name: Installer (.exe, .msi)
        continue-on-error: true
        run: gradle packageExe packageMsi --no-daemon

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/RetouchJobs -DestinationPath RetouchJobs-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RetouchJobs-windows-portable
          path: desktop/RetouchJobs-portable-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RetouchJobs-windows-installer
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
